<!-- BUILDER NOTES for viz-reviewer:
  - viz-data.json has no per-reviewer "lens" one-liners; chips show role names only.
  - Severity counts are computed from findings[] at runtime. Synthesis stated 10/14/6
    post-cross-exam; computed is 10/15/5 (player-psychologist F5 MINOR→MAJOR). Per
    tally_note, computed counts are shown, with a footnote.
  - Engagement→top-issue mapping (ISSUE_ENG) is a curated join, since the JSON has no
    explicit target ids on engagements. Every mapped engagement is verbatim from
    cross_examination[]; mapping chosen by finding references in the text.
  - Design mandates a fixed dark palette; prefers-color-scheme is respected via
    color-scheme:dark (no light variant, to preserve the specified palette).
-->
<style>

*{box-sizing:border-box}

.s-BLOCKING{color:var(--blk);border-color:var(--blk)}

  font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-radius:2px;
  font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
.tagC{color:var(--blk);border:1px solid var(--blk)}
.tagN{color:var(--conn);border:1px solid var(--conn)}
.tagC,.tagN{display:inline-block;padding:1px 8px;font-size:11px;letter-spacing:.15em;
  text-transform:uppercase;font-family:ui-monospace,Consolas,monospace;border-radius:2px}
/* masthead */
.mast{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;margin-bottom:40px}
.eyebrow{color:var(--mut);font-size:13px;letter-spacing:.35em;text-transform:uppercase;
  font-family:ui-monospace,Consolas,monospace;margin-bottom:10px}

.verdict1{font-size:18px;color:var(--text);max-width:640px;margin:6px 0 0}
.stats{display:flex;gap:18px}
.stat{background:var(--panel);padding:16px 22px;min-width:130px;border-radius:4px}
.stat .n{font-size:44px;line-height:1;font-family:"Arial Narrow",Arial,sans-serif}

/* V1 bars */
.panel{background:var(--panel);border-radius:4px;padding:24px}
.togglebar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.segctl{display:inline-flex;border:1px solid var(--hair);border-radius:4px;overflow:hidden}

.bartrack{flex:1;display:flex;height:24px;border-radius:2px;overflow:hidden;background:#181B21}
.barrow.all .bartrack{height:34px}

/* V5 matrix */
.mwrap{overflow-x:auto}
.matrix{display:grid;grid-template-columns:110px repeat(6,100px);gap:4px;width:max-content;margin:0 auto}

  text-align:center;font-family:ui-monospace,Consolas,monospace;letter-spacing:.05em;padding:4px}
.mhead.row{justify-content:flex-end;text-align:right}
.mcell{background:var(--panel);border:1px solid var(--hair);border-radius:2px;min-height:78px;
  display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;padding:6px;width:100%}

.mfilters button[aria-pressed="true"]{color:var(--text);border-color:var(--mut)}

/* V6 */

.fbtn[aria-pressed="true"]{color:var(--text);border-color:var(--mut);background:var(--panel)}

th button{color:inherit;letter-spacing:inherit;font-size:inherit;text-transform:inherit;font-family:inherit}

  font-family:ui-monospace,Consolas,monospace;margin:24px 0 8px}

footer li .qd{color:var(--mut)}

<body>
<div class="wrap">
<header id="mast"></header>
<section id="v1" aria-label="Severity breakdown by reviewer"></section>
<section id="v2" aria-label="Finding severity changes, Round 1 to after cross-examination"></section>
<section id="v3" aria-label="Top five issues"></section>
<section id="v4" aria-label="Unresolved disagreements"></section>
<section id="v5" aria-label="Cross-examination matrix"></section>
<section id="v6" aria-label="All findings table"></section>
<footer id="foot"></footer>
</div>
<div id="tt" role="tooltip"></div>
<script>
const DATA={
"meta":{"document_reviewed":"gdd.txt (Junkstronaut, First Draft)","review_date":"2026-07-20","reviewers":["systems-designer","narrative-critic","player-psychologist","feasibility-lead","adversarial-qa","business-analyst"]},
"findings":[
{"reviewer":"systems-designer","finding_id":"F1","title":"Economic death spiral: bankruptcy is possible but undesigned","severity_round1":"MAJOR","severity_final":"BLOCKING","description":"The economy can strand a player financially and the document does not acknowledge it. A botched reentry destroys the cargo (income) AND damages the hull (a per-% repair bill); the next launch still costs 2-3 cheap pieces' worth of fuel. Two bad runs in a row and cash can go below the cost of the next launch. Economic stranding on the ground is neither a designed loss state nor prevented by any floor (no debt mechanic, no free minimal refuel, no scrap-the-ship option). Either declare bankruptcy a real loss condition and design toward it, or specify the safety net.","reference":"Sections 1, 2.5, 3 — 'Every launch costs money'; loss conditions are only 'stranded with no fuel, or 0 HP'; economy sweep never asks whether a failed run makes the next run unaffordable"},
{"reviewer":"systems-designer","finding_id":"F2","title":"No prices, no run count: playthrough pacing is entirely unspecified","severity_round1":"MAJOR","severity_final":"MAJOR","description":"Upgrade prices ARE the pacing of the entire game (win is 'reachable and landable only near full upgrades'), yet the document contains not one price, no junk values beyond 'launch cost ~= 2-3 cheap pieces', and no target run count for a playthrough. A sweep can only validate a curve against a target, and no target curve exists. With value-scaling-by-mass and bigger holds, income likely grows superlinearly, so late upgrades must cost dramatically more or the back half collapses. The document should state intended total run count, intended mid-game earnings per run, and a rough tier-1:tier-3 price ratio.","reference":"Sections 1, 2.5, 2.6, 3 — omission of any prices, run-count target, or target curve anywhere in the document"},
{"reviewer":"systems-designer","finding_id":"F3","title":"The 'land safer' purchase doesn't exist: difficulty ratchets one way","severity_round1":"MAJOR","severity_final":"MAJOR","description":"Section 2.1's shop row promises 'reach higher, land safer, or haul more', but 2.5's actual tracks are Fuel tank (reach), Thruster (reach), Storage (haul) — parachute, heat shield, and jetpack ship at fixed mid-tier values. There is no 'land safer' purchase. Every Storage purchase makes landings strictly harder with no systemic counter-investment, so difficulty scales with progression with no purchasable relief valve. Either restore a landing-mitigation track or delete the 'land safer' promise and state that landing difficulty only rises.","reference":"Section 2.1 shop row vs. Section 2.5 ('Parachute, heat shield, and jetpack ship at fixed mid-tier values'); Section 3 difficulty chain"},
{"reviewer":"systems-designer","finding_id":"F4","title":"The endgame object's rules are underspecified where they matter most","severity_round1":"MAJOR","severity_final":"BLOCKING","description":"Three unresolved questions in Section 2.6's satellite description: (a) does a damaged satellite still win, win with reduced payout, or force a retry? (b) heat damage is per-slot; the satellite is a single object that 'barely fits a maxed hold' — does one 3-second heat tick destroy the win object? (c) chute descent speed scales with sqrt(mass) and soft is under ~5 m/s; with mass doubled, is a soft landing achievable at fixed mid-tier chute values at all? (a) and (b) are design decisions no sweep can answer. Round 2 math: doubling mass raises descent speed ~41%, so a soft touchdown may be impossible by construction.","reference":"Sections 1, 2.2, 2.3, 2.6 — 'roughly doubles the ship's mass, barely fits a maxed hold, and arrives damaged unless the touchdown is soft'"},
{"reviewer":"systems-designer","finding_id":"F5","title":"Jetpack fuel is a stated cost with no defined economy","severity_round1":"MINOR","severity_final":"MINOR","description":"Jetpack fuel is the price of the core greed decision, but nothing defines the fuel loop: does EVA fuel draw from the ship tank or a separate suit tank, does it refill free at the ship, is it included in 'Armstrong fills the tank'? The loss condition 'stranded with no fuel' doesn't say which fuel — if a player burns the jetpack dry hauling a heavy piece away from the ship, is that a loss, a drift-back-forever, or an undefined softlock?","reference":"Sections 1, 2.4, 2.5 — 'every trip out costs jetpack fuel'; omission of capacity/refill/loss rules"},
{"reviewer":"narrative-critic","finding_id":"F1","title":"The climactic payoff is undefined: what happens when the satellite comes home damaged, or at all?","severity_round1":"MAJOR","severity_final":"BLOCKING","description":"The entire game funnels toward returning Armstrong's satellite, and the document never describes that moment or its success criteria. Nowhere does it state whether a damaged satellite still wins, wins with a lesser ending, or fails the run. There is no ending beat of any kind: no scene of Armstrong receiving the satellite, no epilogue, not even victory-screen intent. The document spends a full section choreographing reentry tension and zero sentences on what that tension pays off into. The climax is currently a rules ambiguity.","reference":"Section 2.6 'arrives damaged unless the touchdown is soft' — a consequence with no stated meaning; Section 1 'Win: retrieve Mr. Armstrong's satellite'; omission of any ending"},
{"reviewer":"narrative-critic","finding_id":"F2","title":"'Starting with his own lost satellite' promises a structure the design doesn't have","severity_round1":"MINOR","severity_final":"MINOR","description":"The Executive Summary frames the satellite as the first objective in a larger campaign ('starting with his own lost satellite'), but the win condition ends the game at exactly that satellite. Either the fiction promises a continuation the game never delivers, or the 'starting with' framing is wrong. The phrase shapes player expectation of scope in the first paragraph, and the design pays it off as a finale, not a beginning. One sentence of rewriting fixes it.","reference":"Section 1: 'starting with his own lost satellite, hanging at the very top of the sky' vs. 'Win: retrieve Mr. Armstrong's satellite'"},
{"reviewer":"narrative-critic","finding_id":"F3","title":"The premise contradicts the goal object","severity_round1":"MINOR","severity_final":"MINOR","description":"The inciting incident is a Kessler cascade that 'shattered every satellite in orbit into valuable junk', yet the win object is an intact satellite that survived the event that destroyed every satellite. No explanation for why Armstrong's satellite alone endured, why it is the heaviest object in the game, or why it sits at the very top of the flight envelope. As written the story's setup and its objective are mutually exclusive; the goal object's traits read as difficulty-curve reverse-engineering with no fictional cover. Fixable with a single clause.","reference":"Section 1: 'shattered every satellite in orbit into valuable junk' vs. Sections 1/2.6: the intact satellite 'at the very top'"},
{"reviewer":"narrative-critic","finding_id":"F4","title":"Armstrong is the game's only character and has no motivation, no voice, and no defined relationship to the player","severity_round1":"MAJOR","severity_final":"MAJOR","description":"Armstrong functions purely as an economy valve: fills the tank, repairs at a flat fee, buys the haul, sells upgrades. The document never says why he wants the satellite, who the player is to him, or what he sounds like. The design has accidentally built a potent theme it never acknowledges: the player's sole buyer is also their sole supplier — a company-store arrangement that IS the blue-collar thematic pillar, sitting unclaimed. No dialogue intent, no tone guidance, no character section. The 'stranded with no fuel' loss state implies Armstrong lets his scrapper die in orbit, neither leaned into nor softened. Round 2: held at MAJOR but strengthened — load-bearing for colleagues' onboarding-channel, off-pad-buyer, and company-store findings.","reference":"Section 1 (Armstrong introduced, never characterized); Section 2.5 (pure transaction); #Thematic pillar; omission of any character/dialogue/tone section"},
{"reviewer":"narrative-critic","finding_id":"F5","title":"The 'handmade scrapyard' aesthetic pillar is undercut by the document's own asset plan","severity_round1":"MINOR","severity_final":"MINOR","description":"The thematic pillar promises blue-collar handmade spacecraft, but the art strategy is off-the-shelf pixel packs plus a planet generator, with the Art Director agent explicitly cut. Stock pixel packs are generic sci-fi — the opposite of a junk-built visual identity — and the document provides no selection criteria, reference imagery, or note on bending stock assets toward the scrap fiction. No mechanism exists by which the central aesthetic promise gets expressed. A short art-direction paragraph would close the gap.","reference":"Section 1 '#Thematic — Scrapyard Spaceflight, blue-collar handmade spacecraft' vs. Section 4.1 (pixel packs) and Section 4.3 (Art Director cut)"},
{"reviewer":"player-psychologist","finding_id":"F1","title":"No onboarding path for a mechanic that punishes first attempts with permanent, irreversible loss","severity_round1":"BLOCKING","severity_final":"BLOCKING","description":"Reentry is the game's most complex and least forgiving system — stage (one-way, kills all thrust), wait through plasma (chute shreds if deployed early), read a visual cue, deploy chute, then gear — and the punishment for a mistake is losing the cargo from a whole run. No tutorial, no practice mode, no first-launch scaffolding, no low-stakes way to learn. A new player's first 2-3 reentries will almost certainly destroy their haul; losing a session's reward to an untaught rule is a classic rage-quit generator in the first 20 minutes. Anxiety only works as a positive emotion once the player understands the system; before that it is confusion followed by punishment.","reference":"Section 2.2 (reentry rules, cargo-damages-first), Section 1 pillars; omission of any onboarding, tutorial, or first-hour design"},
{"reviewer":"player-psychologist","finding_id":"F2","title":"The most punishing decision in the game hangs on a single subtle color cue","severity_round1":"MAJOR","severity_final":"MAJOR","description":"The only stated signal for chute safety is 'the hull glow fades from white toward orange' — a low-contrast, single-channel cue on a small pixel-art ship, gating a binary catastrophic outcome (chute shreds vs. works). Players under stress do not reliably read gradual color shifts, and colorblind players (~8% of male players) may not read this one at all. No audio cue, no HUD element, no speed readout — and the 'reentry sensor' that might have served this role is explicitly cut. Players will blame the game when the chute shreds: the input they acted on was ambiguous.","reference":"Section 2.2 ('When the plasma clears — the hull glow fades from white toward orange — deploy chute'); Section 4.3 ('reentry sensor' cut)"},
{"reviewer":"player-psychologist","finding_id":"F3","title":"Failure recovery is undefined; the economy can plausibly death-spiral into a quit","severity_round1":"MAJOR","severity_final":"BLOCKING","description":"Loss conditions are 'stranded with no fuel, or 0 HP' — but the document never says what happens next (restart? reload? is there a save system?). Worse, the economy has a visible spiral: every launch costs money, and a crash destroys the cargo that would have paid for it. A player who crashes twice pays full repair costs with nothing sold. Nothing addresses the broke-player state: can you afford a launch after a bad crash, or are you softlocked into a slow-motion game over? The floor under failure has to be defined and isn't.","reference":"Section 1 (loss conditions), Section 2.5 (launch costs, break-even claim); omission of any failure-recovery, save, or minimum-guarantee rule"},
{"reviewer":"player-psychologist","finding_id":"F4","title":"The win condition stacks the game's three cruelest constraints on its longest run, with an ambiguous 'damaged' outcome","severity_round1":"MAJOR","severity_final":"MAJOR","description":"The satellite roughly doubles ship mass, barely fits a maxed hold, and arrives damaged unless touchdown is soft (<~5 m/s). Chute descent speed grows with mass, and this is the heaviest haul from the highest altitude — hottest reentry, latest and lowest chute window. The finale demands the game's most precise landing under its worst landing conditions, at the end of its longest flight; every failed attempt costs the full round trip plus repairs, and 'arrives damaged' has no stated meaning for the win. If players must repeat the run until they thread a near-impossible landing, the endgame becomes a frustration cliff exactly where they should feel mastery. Machine-beatable by a sweep is not human-repeatable.","reference":"Sections 1, 2.3, 2.6, 3; omission of what a damaged satellite means for the win state"},
{"reviewer":"player-psychologist","finding_id":"F5","title":"Nine total purchases with break-even floors risks a flat motivation curve in the mid-game","severity_round1":"MINOR","severity_final":"MAJOR","description":"The entire progression is 3 parts x 3 tiers = 9 purchases with parachute/heat shield/jetpack fixed forever. No upgrade prices relative to haul values, so pacing between purchases is unknowable — and the structure is thin: between upgrades there is nothing to buy, no intermediate rewards, no cosmetic or narrative drip, and break-even runs produce literally zero progress. Repetitive hauls with no visible progress between tier purchases is where session-two retention dies. The moment-to-moment greed loop is genuinely good; the meta-loop above it is nine beats long with silence in between.","reference":"Section 2.5 (9 purchases, fixed mid-tier equipment, break-even lazy runs); omission of pacing targets, pricing, or secondary reward structure"},
{"reviewer":"feasibility-lead","finding_id":"F1","title":"The headless Playtester requires an unbudgeted autopilot","severity_round1":"BLOCKING","severity_final":"BLOCKING","description":"Section 3's Playtester questions require an automated pilot capable of executing the entire mission loop — launch, ascent guidance, EVA jetpack navigation, tether collection, staged reentry, chute timing, and a graded soft landing. That is a scripted/optimal-control problem in its own right and is nowhere in the document. The harness that iterates configs is trivial; the pilot that flies each config is the actual work, and the half-day timebox is not credible. The stated hand-tuning fallback rescues the game but silently deletes Section 3's entire measurement methodology. Round 2: without the autopilot, the win condition has no verification path of any kind — no human playtest is scheduled either.","reference":"Section 3 Playtester ('Runs headless Godot across a grid of config values...'), Section 4.4 ('The sweep harness... Timebox: half a day')"},
{"reviewer":"feasibility-lead","finding_id":"F2","title":"Tuning methodology contradicts its own fallback","severity_round1":"MAJOR","severity_final":"MAJOR","description":"Section 3 claims the difficulty loop is 'coupled and nonlinear, so its behavior is determined empirically by sampling the parameter space' — i.e., hand-reasoning won't work. Section 4.4's fallback for losing the sweep harness is hand-tuning. Both statements cannot be true. If empirical sampling is genuinely required, the half-day harness is a critical-path dependency and should be built Day 1; if hand-tuning is viable, the empirical framing is overstated and the sweeps should be marked cuttable. Round 2: confidence raised — the business-analyst independently found the identical contradiction.","reference":"Section 3 ('coupled and nonlinear... determined empirically') vs. Section 4.4 ('Fallback is hand-tuning for the rest of the build — the game ships either way')"},
{"reviewer":"feasibility-lead","finding_id":"F3","title":"No schedule, and the hardest system is a universal dependency","severity_round1":"MAJOR","severity_final":"MAJOR","description":"The custom fixed-timestep gravity integrator is named one of the two hardest problems and is the foundation for everything: rocket flight, EVA, tether coupling, heat/drag, and the determinism that enables the Playtester. Yet there is no build order or day-by-day plan; only a Day-3 towing gate and a half-day sweep timebox are scheduled. If the integrator slips or ships nondeterministic (accumulated float error is a classic failure), every downstream session and both sweeps are invalidated, with no stated gate or fallback. It needs to be proven by end of Day 1 with an explicit determinism test in the QA invariant list; neither appears.","reference":"Sections 4.1, 4.2, 3; omission of any schedule or integrator fallback in Section 4.4"},
{"reviewer":"feasibility-lead","finding_id":"F4","title":"Token budget has zero rework margin and untracked work items","severity_round1":"MAJOR","severity_final":"BLOCKING","description":"Section 4.2's arithmetic (~150-200k/day, ~1.2M/week) assumes every Coder session lands its mechanic in one pass, but Section 3's own process guarantees rework ('A red test returns to the Coder'). ~11-12 Coder sessions at 95-115k per cycle fully consume the week with no allowance for shop UI, HUD, menus, art integration, or the two Opus problems (Opus burns the Pro allowance several times faster, unmodeled). Any single bad day forces cuts, and the document does not say which mechanic gets cut first. Round 2 upgrade: nearly every fix the board proposes is additive, and the plan names no cut priority beyond towing — not schedulable as written.","reference":"Section 4.2 entire; Section 3 ('A red test returns to the Coder'); omission of UI/shop/HUD from the session cadence"},
{"reviewer":"feasibility-lead","finding_id":"F5","title":"QA 'reads the spec, not the implementation' has no API contract","severity_round1":"MINOR","severity_final":"MINOR","description":"QA is budgeted at ~25k tokens because the test suite reads the spec and invariant list rather than the implementation — but GUT tests must instantiate real classes, call real method names, and assert on real signals, none of which exist in the spec. Without a pre-agreed API contract (node names, method signatures, config keys), either QA reads the implementation anyway (blowing the budget) or every QA session produces tests that fail to compile. The single game_params.tres convention solves constants but not behavior-level APIs. One page of interface contract would fix this.","reference":"Section 4.2 ('QA sessions run ~25k, since the test suite reads the spec and the invariant list rather than the implementation')"},
{"reviewer":"adversarial-qa","finding_id":"F1","title":"Armstrong's satellite can be destroyed, making the game unwinnable","severity_round1":"BLOCKING","severity_final":"BLOCKING","description":"The win condition is 'retrieve Mr. Armstrong's satellite'; cargo takes heat damage during hot reentry and landing damage scales with vertical speed. Nothing states whether the satellite can be destroyed outright, whether a destroyed satellite respawns, or whether a damaged satellite still counts as a win. If the heaviest object in the game — which by design runs the hottest reentry and the latest, lowest chute window — burns up or is destroyed on a hard landing, the player may be locked into a permanently unwinnable save with no listed fail state covering it. The Playtester question tests that success is possible, not what happens on failure.","reference":"Sections 1 (win/loss), 2.2, 2.3, 2.6 — omission of satellite persistence/destruction rules"},
{"reviewer":"adversarial-qa","finding_id":"F2","title":"Staging is one-way, but every successful run ends staged; the ship's engine replacement is never specified","severity_round1":"MAJOR","severity_final":"MAJOR","description":"Staging jettisons tank and thruster — one-way, no thrust after — and is required for any shielded reentry, so every landing leaves a ship with no thruster and no tank. Armstrong 'fills the tank' — a tank that was jettisoned in the upper atmosphere. Stage replacement is never priced, never mentioned as free, never mentioned at all. Related edge case: pressing B (stage) on the launch pad leaves the player with fuel but no thrust — matching neither listed loss condition. That is an undefined soft-lock reachable with one keypress.","reference":"Sections 2.1 (stage on B), 2.2 ('one-way, no thrust after'), 2.5 (refuel/repair list omits stages); Section 1 loss conditions"},
{"reviewer":"adversarial-qa","finding_id":"F3","title":"EVA fail states are entirely unhandled: jetpack fuel exhaustion, exit during descent, ship/astronaut separation","severity_round1":"MAJOR","severity_final":"MAJOR","description":"Unhandled cases: (a) astronaut runs out of jetpack fuel while tethered to a heavy piece away from the ship — stranded, death, or drift-forever? Jetpack capacity, refill rules, and whether it counts toward the 'stranded with no fuel' loss are all unstated. (b) Can the player press F and exit during atmospheric descent? An astronaut in plasma has no defined outcome. (c) Both ship and astronaut are on ballistic arcs — no rule says the ship holds station while the player is out hauling junk.","reference":"Sections 2.1 (unconditional F verb), 2.4 (jetpack fuel cost with no capacity/refill/failure rules); Section 1 loss list"},
{"reviewer":"adversarial-qa","finding_id":"F4","title":"'Cargo damages before hull' turns cheap junk into ablative armor; burn order and mass-after-destruction are unspecified","severity_round1":"MAJOR","severity_final":"MAJOR","description":"Two omissions create an exploit: (1) which slot burns first — cheapest, random, last-stowed? If cheapest-first or player-orderable, the optimal strategy is padding the hold with worthless panels as sacrificial heat shielding for high-value pieces, inverting the intended greed penalty. (2) Does a destroyed slot's mass disappear? If yes, an overloaded ship sheds mass mid-reentry as it burns, cooling itself and pulling the chute window earlier — overloading becomes partially self-correcting and the punishment softens exactly when it should bite. The ambiguity will get baked into the QA agent's tests as written. Round 2 note: now clearly a decision, not an investigation — two sentences close it.","reference":"Section 2.2 (damage ordering), 2.3 (chute speed vs. mass), Section 3 (QA invariant list) — omission of burn order and destroyed-cargo mass rules"},
{"reviewer":"adversarial-qa","finding_id":"F5","title":"Bankruptcy soft-lock: intact ship, empty wallet, and no loss condition that covers it","severity_round1":"MAJOR","severity_final":"BLOCKING","description":"Sequence: player takes a hard-but-survivable landing, cargo destroyed by heat, hull heavily damaged, cash below (repair + fuel). The player is alive, landed, and cannot afford to launch. Neither loss condition ('stranded with no fuel, or 0 HP') triggers — you have a ship, you just can't pay Armstrong. The 'lazy run breaks even' claim assumes you can afford the launch and assumes zero repair bill. Nothing specifies a debt floor, free minimal refuel, or bankruptcy game-over, and the economy sweep never samples the post-crash recovery path. Round 2: the triggering sequence sits on the mandatory new-player path, in the first hour.","reference":"Section 2.5 (launch cost, per-% repair fee), Section 1 (loss conditions), Section 3 (economy sweep scope) — omission of a broke-but-alive state"},
{"reviewer":"business-analyst","finding_id":"F1","title":"No audience or positioning statement, and the document is visibly two documents at once","severity_round1":"MAJOR","severity_final":"MAJOR","description":"Nowhere does the document say who plays this game or what it sits next to: no target-player statement, no comparable titles (Dome Keeper, Motherload-likes, Hardspace: Shipbreaker, Lunar Lander go unmentioned), no session-length or platform framing beyond 'keyboard and mouse only'. Roughly half the page count is an AI-production methodology paper addressed to a grader, not a design document addressed to a team. Every design decision is justified by tuning cost or agent workflow, none by a stated player or market. Round 2 note: the missing audience statement is why the board cannot consistently rank its own findings.","reference":"Header line; Sections 3, 4.2; total absence of audience/comps/positioning language"},
{"reviewer":"business-analyst","finding_id":"F2","title":"The shop's advertised decision axis does not exist in the upgrade catalog","severity_round1":"MAJOR","severity_final":"MAJOR","description":"The controls table says the shop decision is 'reach higher, land safer, or haul more', but 2.5 defines only Fuel tank, Thruster, and Storage, with parachute/heat shield/jetpack fixed at mid-tier. There is no 'land safer' purchase. Worse: the satellite is 'reachable and landable only near full upgrades', so all 9 purchases are mandatory and the only real player choice is ordering. Storage is the only interesting purchase; Fuel tank and Thruster are pure gates. The shop is presented as a decision space but is functionally a linear progression track wearing one. Either add a real safety-side purchase or stop advertising a three-way choice.","reference":"Section 2.1 shop row vs. Section 2.5 ('fixed mid-tier values') vs. Section 1 win condition"},
{"reviewer":"business-analyst","finding_id":"F3","title":"The production plan's fallback contradicts the design's own central claim","severity_round1":"MAJOR","severity_final":"BLOCKING","description":"Section 3 stakes the design on empirical sampling ('coupled and nonlinear... determined empirically'); Section 4.4 timeboxes the sampling instrument at half a day and declares the fallback is hand-tuning — 'the game ships either way.' Both cannot be true. If the loop genuinely requires empirical sampling, hand-tuning ships an untuned game; 'ships either way' is a schedule promise, not a quality promise. Round 2 upgrade: the feasibility-lead's autopilot analysis shows the empirical path is unachievable as scheduled, so the fallback is the de facto plan — both the graded methodology and the tuned-game claim fail on the document's own terms.","reference":"Section 3 ('determined empirically by sampling the parameter space') vs. Section 4.4 ('Fallback is hand-tuning for the rest of the build — the game ships either way')"},
{"reviewer":"business-analyst","finding_id":"F4","title":"No pacing targets: the economy sweep has nothing to sweep toward","severity_round1":"MAJOR","severity_final":"MAJOR","description":"The Playtester's questions ('does a lazy run break even?', 'is the satellite run beatable?') are binary feasibility checks, not pacing targets. The document never states how long a run should take, how many runs the campaign should take, or total intended playtime. The sweep can confirm the game is completable but cannot tell whether it is a 25-minute game or a 6-hour grind, and the 9-purchase mandatory ladder makes campaign length a direct function of numbers no one has bounded. For a graded/demoed one-week deliverable, 'how long is this game' has no answer.","reference":"Section 3 Playtester description (binary questions only); omission of any run-length, run-count, or playtime target"},
{"reviewer":"business-analyst","finding_id":"F5","title":"'Sells anywhere you come down' quietly implies a world the document never scopes","severity_round1":"MINOR","severity_final":"MINOR","description":"'An intact landing sells the haul wherever you come down' implies landable terrain beyond the launch pad — a 2D surface of some extent, off-pad landing zones, and some answer to how the rocket returns to the pad. None of this appears in the mechanics, the art plan, or the cut list. Probably a one-line answer ('run auto-resets to the pad'), but right now it is an unpriced feature hiding inside a sentence about economy, and unpriced features are how disciplined scopes die in week-long builds. Round 2: should be read as part of the unpriced-cost-model pattern with QA's F2 and F5.","reference":"Sections 2.3 and 4.3 ('sells anywhere'); omission of any world/terrain/recovery description"}
],

{"versus":"player-psychologist","their_finding":"F1 (onboarding, BLOCKING)","summary":"Pushes back on severity: the physics imply a natural early-game ramp — a tier-1 ship flies slow, light, and low, so first reentries should be the coolest the game produces, and cargo-before-hull is graduated punishment. The scaffold is accidental and unverified, though; argues MAJOR-pending-verification, with 'add a starter-ship heat question to the reentry sweep' as the cheap settling fix."},
{"versus":"player-psychologist / business-analyst","their_finding":"psychologist F5 (flat mid-game, MINOR) / business-analyst F2","summary":"Defends rating the same territory MAJOR: break-even runs produce mathematically zero progress toward a win requiring near-full upgrades — a stable orbit of playing-without-progressing. Also tempers the business-analyst's 'ordering is the only choice' claim: ordering can be a real economic decision, but only if prices force trade-offs, and no prices exist."}],

{"with":["adversarial-qa","narrative-critic","player-psychologist"],"insight":"The satellite endgame ambiguity is one hole seen from four lenses. New math: chute speed scales with sqrt(mass), so doubling mass raises descent speed ~41% — if a full-hold landing is tuned near the 5 m/s threshold, the satellite run lands near 7 m/s and a soft touchdown is impossible by construction. No sweep can rescue that."},
{"with":["feasibility-lead","business-analyst"],"insight":"Both tuning paths fail for the same missing input: a sweep can only validate against a target curve, and hand-tuning needs targets even more. Writing down run count, mid-game earnings, and tier price ratios is upstream of the entire Section 3 methodology, whichever instrument survives."}],

{"versus":"adversarial-qa","their_finding":"F4 (cargo as ablative armor — 'exploit')","summary":"Argues the opposite of closing the loophole: sacrificial cargo is one of the only self-directed mitigation tools the design accidentally offers — planned loss is motivating, unforeseen loss is a quit. Recommendation: specify burn order deliberately (player-orderable or last-stowed-first), surface it in UI, make sacrificial padding intentional. QA is right the ambiguity is a defect, wrong that the behavior itself is one."},
{"versus":"systems-designer","their_finding":"F3 ('land safer' doesn't exist)","summary":"Rejects the 'delete the promise' branch as an equal option: if difficulty ratchets monotonically with zero purchasable relief, the player facing the satellite run has no lever but raw retry, which costs a full round trip plus repairs. Deleting the promise fixes the document's honesty but leaves the frustration cliff intact; only the mitigation-track branch produces a shippable player experience."},
{"versus":"feasibility-lead","their_finding":"F1 (hand-tuning fallback 'rescues the game')","summary":"Disputes 'survives': the two most quit-prone moments live inside narrow numeric windows; a hand-tuned chute window 15% too tight turns the finale into one most players never clear, and no human will hand-feel that threshold across nine mass/upgrade combinations. 'The game ships either way' is a schedule truth and a player-experience falsehood — the harness is the only thing standing between MAJOR findings and BLOCKING ones."}],

    const html=`<span class="chip">${f.reviewer}</span> <span class="mono">${f.finding_id}</span><br><b>${esc(f.title)}</b><br>
      <span class="m">${f.severity_round1} → ${f.severity_final}${rv?` · ${rv.action.toUpperCase()}`:""}</span>
      ${rv&&rv.reason&&rv.reason!=="Unchanged."?`<div class="m" style="margin-top:6px">“${esc(rv.reason)}”</div>`:""}`;
    g.addEventListener("mousemove",e=>{dim(g);showTT(html,e.clientX,e.clientY);});
    g.addEventListener("mouseleave",()=>{dim(null);hideTT();});
    g.addEventListener("focus",()=>{dim(g);const r=g.getBoundingClientRect();showTT(html,r.left+40,r.top);});
    g.addEventListener("blur",()=>{dim(null);hideTT();});
    const go=()=>{hideTT();gotoFinding(f.key);};
    g.addEventListener("click",go);
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
  });
  let iso=null;
  function isolate(mode,btn){
    iso=iso===mode?null:mode;
    groups.forEach(g=>g.style.display=(iso===null||(iso==="c")===(g.dataset.ch==="1"))?"":"none");
    document.getElementById("lgC").setAttribute("aria-pressed",iso==="c");
    document.getElementById("lgH").setAttribute("aria-pressed",iso==="h");
  }
  document.getElementById("lgC").onclick=()=>isolate("c");
  document.getElementById("lgH").onclick=()=>isolate("h");
  document.getElementById("lgC").style.color="var(--blk)";
})();

/* ---------- V3 top issues ---------- */
const parseFlag=s=>{const m=s.match(/^([a-z-]+)\s*(F\d)?\s*(?:\(([^)]*)\))?/);return{rev:m[1],fid:m[2]||null,note:m[3]||""};};
const v3=document.getElementById("v3");
v3.innerHTML=`<h2>Top 5 issues — ranked by severity × confidence</h2>
<p class="sub">The moderator's synthesis. Expand a card for the Round 1 findings behind it, the Round 2 cross-examination trail, and where it landed.</p>`+
DATA.synthesis.top_issues.map(iss=>{
  const sevMain=iss.severity.split(" ")[0],sub=iss.severity.includes("(")?iss.severity.slice(iss.severity.indexOf("(")):"";
  const flags=iss.flagged_by.map(parseFlag);
  const oc=iss.cross_examination_outcome;
  const chips=iss.flagged_by.map(s=>{const p=parseFlag(s);
    return chip(p.rev+(p.fid?" · "+p.fid:"")+(p.note?" "+p.note:""));}).join(" ");
  const r1rows=flags.filter(p=>p.fid).map(p=>{const f=FK[p.rev+"-"+p.fid];if(!f)return "";
    return `<div class="r1row">${chip(p.rev)} ${stamp(f.severity_round1)} <span class="t">${esc(f.title)}</span>
      <span class="d">${esc(firstSent(f.description))}</span></div>`;}).join("");
  const engrows=(ISSUE_ENG[iss.rank]||[]).map(k=>{const e=EK[k];if(!e)return "";
    return `<div class="engrow"><span class="${e.type==="conflict"?"tagC":"tagN"}">${e.type}</span>
      <span class="who">${e.from} → ${e.about.join(", ")}${e.ref?" · re: "+esc(e.ref):""}</span>
      <p>${esc(e.text)}</p></div>`;}).join("");
  const disRef=ISSUE_DIS[iss.rank];
  const dis=disRef?DATA.synthesis.unresolved_disagreements.find(d=>d.id===disRef):null;
  return `<div class="card" id="issue-${iss.rank}">
  <button class="cardhead" aria-expanded="${iss.rank===1}" aria-controls="ib-${iss.rank}">
    <div class="rank" aria-hidden="true">${iss.rank}</div>
    <div style="flex:1;min-width:0">
      <div>${stamp(sevMain)} <span class="stamp" style="color:${oc==="WEAKENED"?"var(--mut)":"var(--text)"};border-color:${oc==="WEAKENED"?"var(--min)":"#4a505b"}">${oc}</span>
      ${sub?`<span class="subcap"> ${esc(sub)}</span>`:""}${oc==="WEAKENED"?`<span class="subcap"> — diagnosis accepted; severity and remedy contested</span>`:""}</div>
      <div class="cardtitle">${esc(iss.title)}</div>
      <div>${chips}</div></div>
    <div class="chev" aria-hidden="true">▾</div></button>
  <div class="cardbody" id="ib-${iss.rank}" ${iss.rank===1?"":"hidden"}>
    <div class="blk-h">Round 1 — independent findings</div>${r1rows||'<p class="subcap">Flagged via cross-examination connections rather than a standalone Round 1 finding.</p>'}
    <div class="blk-h">Round 2 — cross-examination</div>${engrows}
    <div class="blk-h">Where it landed</div>
    <p class="landed">${esc(iss.summary)}</p>
    ${dis?`<button class="linkbtn" data-dis="${dis.id}">→ Unresolved disagreement ${dis.id}: ${esc(dis.question)}</button>`:""}
  </div></div>`;
}).join("");
document.querySelectorAll("#v3 .cardhead").forEach(h=>h.addEventListener("click",()=>{
  const body=document.getElementById(h.getAttribute("aria-controls"));
  const open=h.getAttribute("aria-expanded")==="true";
  h.setAttribute("aria-expanded",String(!open));body.hidden=open;
}));
document.querySelectorAll("#v3 .linkbtn").forEach(b=>b.addEventListener("click",e=>{
  e.stopPropagation();openDis(b.dataset.dis,true);}));

/* ---------- V4 disagreements ---------- */
const v4=document.getElementById("v4");
v4.innerHTML=`<h2>The board could not settle — ${DATA.synthesis.unresolved_disagreements.length} decisions escalated to the design owner</h2>
<p class="sub">Unresolved conflicts from Round 2, position vs. position. These are decisions, not open questions: the board argued both sides and stopped.</p>`+
DATA.synthesis.unresolved_disagreements.map((d,i)=>{
  const p1=splitHolders(d.position_1_holders),p2=splitHolders(d.position_2_holders);
  return `<div class="dis" id="dis-${d.id}">
  <button class="dishead" aria-expanded="${i===0}" aria-controls="db-${d.id}">
    <span class="badge" aria-hidden="true">${d.id}</span>
    <span class="distitle">${esc(d.question)}</span>
    <span>${p1.map(chip).join(" ")}<span class="vs">vs.</span>${p2.map(chip).join(" ")}</span>
    <span class="chev" aria-hidden="true">▾</span></button>
  <div class="disbody" id="db-${d.id}" ${i===0?"":"hidden"}>
    <div class="cols">
      <div class="pos">${p1.map(chip).join(" ")}<p>${esc(d.position_1)}</p></div>
      <div class="pos">${p2.map(chip).join(" ")}<p>${esc(d.position_2)}</p></div></div>
    ${d.middle_position?`<div class="mid"><span class="blk-h" style="margin:0 10px 0 0;display:inline">Middle position</span>${chip(d.middle_position_holders)}<p>${esc(d.middle_position)}</p></div>`:""}
    <div class="esc"><b>DECISION ESCALATED:</b> ${esc(d.escalated_decision)}</div>
  </div></div>`;}).join("");
document.querySelectorAll("#v4 .dishead").forEach(h=>h.addEventListener("click",()=>{
  const body=document.getElementById(h.getAttribute("aria-controls"));
  const open=h.getAttribute("aria-expanded")==="true";
  h.setAttribute("aria-expanded",String(!open));body.hidden=open;}));
function openDis(id,flash){
  const panel=document.getElementById("dis-"+id);
  const h=panel.querySelector(".dishead");
  h.setAttribute("aria-expanded","true");
  document.getElementById("db-"+id).hidden=false;
  panel.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});
  if(flash){panel.classList.remove("flash");void panel.offsetWidth;panel.classList.add("flash");}
  h.focus({preventScroll:true});
}

/* ---------- V5 matrix ---------- */
const SHORT={"systems-designer":"SYS","narrative-critic":"NARR","player-psychologist":"PSY","feasibility-lead":"FEAS","adversarial-qa":"QA","business-analyst":"BIZ"};
const v5=document.getElementById("v5");
const cellMap={}; ENG.forEach(e=>e.about.forEach(a=>{const k=e.from+"|"+a;(cellMap[k]=cellMap[k]||[]).push(e);}));
v5.innerHTML=`<h2>Cross-examination — who engaged whom</h2>
<p class="sub">Rows: the reviewer speaking. Columns: the colleague whose finding is engaged. Red pills are conflicts, blue pills are connections; a red left edge marks pairs that ended in an escalated disagreement. The diagonal shows each reviewer's own Round 2 revisions. Click a cell for the full arguments.</p>
<div class="mfilters" role="group" aria-label="Filter engagement type">
<button id="fC" aria-pressed="false">Conflicts only</button>
<button id="fN" aria-pressed="false">Connections only</button></div>
<div class="mwrap"><div class="matrix" role="grid" aria-label="6 by 6 cross-examination matrix">
<div class="mhead" role="columnheader">FROM \\ ABOUT</div>
${REV.map(r=>`<div class="mhead" role="columnheader" id="ch-${r}" title="${r}">${SHORT[r]}</div>`).join("")}
${REV.map(from=>`<div class="mhead row" role="rowheader" id="rh-${from}" title="${from}">${SHORT[from]}</div>`+
  REV.map(about=>{
    if(from===about){
      const rvs=DATA.cross_examination.find(c=>c.reviewer===from).revisions;
      const up=rvs.filter(r=>r.action==="upgraded").length,held=rvs.filter(r=>r.action==="held").length;
      return `<div class="mcell diag" role="gridcell" aria-label="${from} self-revisions: ${up} upgraded, ${held} held">${up?up+" UPGR":""}${up&&held?" · ":""}${held?held+" HELD":""}</div>`;}
    const list=cellMap[from+"|"+about]||[];
    if(!list.length)return `<div class="mcell empty" role="gridcell" aria-label="${from} did not directly engage ${about}"></div>`;
    const nc=list.filter(e=>e.type==="conflict").length,nn=list.filter(e=>e.type==="connection").length;
    const cont=contestedPairs.has(from+"|"+about);
    return `<button class="mcell${cont?" contested":""}" role="gridcell" data-f="${from}" data-a="${about}"
      aria-label="${from} on ${about}: ${nc} conflicts, ${nn} connections${cont?"; pair feeds an escalated disagreement":""}. Activate for details.">
      ${nc?`<span class="pill tagC" data-t="conflict">${nc} CONFLICT${nc>1?"S":""}</span>`:""}
      ${nn?`<span class="pill tagN" data-t="connection">${nn} CONNECTION${nn>1?"S":""}</span>`:""}</button>`;
  }).join("")).join("")}
</div></div>
<p class="caption" style="text-align:center">Red-edged cells feed the escalated disagreements above · diagonal = self-revisions after reading the board · ${ENG.filter(e=>e.type==="conflict").length} conflicts and ${ENG.filter(e=>e.type==="connection").length} connections raised in total (multi-target engagements appear in each colleague's column).</p>
<div id="strip" class="strip" hidden></div>`;
let mFilter=null;
function applyMF(){
  document.querySelectorAll("#v5 .pill").forEach(p=>p.classList.toggle("dimmed",mFilter&&p.dataset.t!==mFilter));
  document.getElementById("fC").setAttribute("aria-pressed",mFilter==="conflict");
  document.getElementById("fN").setAttribute("aria-pressed",mFilter==="connection");}
document.getElementById("fC").onclick=()=>{mFilter=mFilter==="conflict"?null:"conflict";applyMF();};
document.getElementById("fN").onclick=()=>{mFilter=mFilter==="connection"?null:"connection";applyMF();};
document.querySelectorAll("#v5 button.mcell").forEach(c=>{
  const from=c.dataset.f,about=c.dataset.a,list=cellMap[from+"|"+about];
  c.addEventListener("mousemove",e=>{hl(from,about,true);
    showTT(`<b>${from} → ${about}</b><div class="m">${list.map(en=>esc(en.text.slice(0,80))+"…").join("<br>")}</div>`,e.clientX,e.clientY);});
  c.addEventListener("mouseleave",()=>{hl(from,about,false);hideTT();});
  c.addEventListener("click",()=>{hideTT();
    const strip=document.getElementById("strip");
    strip.hidden=false;
    strip.innerHTML=`<button class="close" aria-label="Close details">×</button>
      <div class="blk-h" style="margin-top:0">${from} → ${about}</div>`+
      list.map(en=>`<div class="engrow"><span class="${en.type==="conflict"?"tagC":"tagN"}">${en.type}</span>
        ${en.ref?`<span class="who">re: ${esc(en.ref)}</span>`:""}<p>${esc(en.text)}</p>
        ${en.type==="conflict"?refLinks(en):""}</div>`).join("");
    strip.querySelector(".close").onclick=()=>{strip.hidden=true;};
    strip.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"nearest"});});
});
addEventListener("keydown",e=>{if(e.key==="Escape"){document.getElementById("strip").hidden=true;hideTT();}});
function hl(f,a,on){document.getElementById("rh-"+f).style.color=on?"var(--text)":"";
  document.getElementById("ch-"+a).style.color=on?"var(--text)":"";}
function refLinks(en){
  const ids=(en.ref.match(/F\d/g)||[]);
  const links=[];
  ids.forEach(fid=>en.about.forEach(a=>{if(FK[a+"-"+fid]&&(en.about.length===1||en.ref.toLowerCase().includes(a.split("-")[0])))
    links.push(a+"-"+fid);}));
  const uniq=[...new Set(links)];
  return uniq.length?`<div style="margin-top:6px">${uniq.map(k=>`<button class="linkbtn" style="margin:0 8px 0 0;padding:2px 10px" onclick="gotoFinding('${k}')">view ${k}</button>`).join("")}</div>`:"";
}

/* ---------- V6 table ---------- */
const v6=document.getElementById("v6");
const state={rev:"ALL",sev:"ALL",useR1:false,changedOnly:false,sortCol:"final",sortDir:1,open:new Set()};
v6.innerHTML=`<h2>Full board — every finding, both rounds</h2>
<p class="sub">All ${F.length} findings. Click a row for the full text, source citation, and — if cross-examination moved it — why. Column headers sort.</p>
<div class="controls">
<div class="fgroup" role="group" aria-label="Filter by reviewer">${["ALL",...REV].map(r=>`<button class="fbtn" data-rev="${r}" aria-pressed="${r==="ALL"}">${r}</button>`).join("")}</div>
<div class="fgroup" role="group" aria-label="Filter by severity">${["ALL",...SEVS].map(s=>`<button class="fbtn" data-sev="${s}" aria-pressed="${s==="ALL"}">${s}</button>`).join("")}</div>
<label class="ck"><input type="checkbox" id="ckR1"> use Round 1 severity</label>
<label class="ck"><input type="checkbox" id="ckCh"> only findings cross-examination moved</label>
</div>
<div class="count" id="tcount" aria-live="polite"></div>
<table><thead><tr>
<th><button data-sort="rev">Reviewer ▸</button></th><th>Finding</th>
<th><button data-sort="r1">R1 severity ▸</button></th>
<th><button data-sort="final">Final severity ▸</button></th>
<th>Changed</th></tr></thead><tbody id="tbody"></tbody></table>`;
function renderTable(){
  const field=state.useR1?"severity_round1":"severity_final";
  let rows=F.filter(f=>(state.rev==="ALL"||f.reviewer===state.rev)&&(state.sev==="ALL"||f[field]===state.sev)&&(!state.changedOnly||f.changed));
  rows.sort((a,b)=>{
    let d=0;
    if(state.sortCol==="rev")d=REV.indexOf(a.reviewer)-REV.indexOf(b.reviewer);
    else if(state.sortCol==="r1")d=SRANK[a.severity_round1]-SRANK[b.severity_round1];
    else d=SRANK[a.severity_final]-SRANK[b.severity_final];
    if(!d)d=REV.indexOf(a.reviewer)-REV.indexOf(b.reviewer)||a.finding_id.localeCompare(b.finding_id);
    return d*state.sortDir;});
  document.getElementById("tcount").textContent=`Showing ${rows.length} of ${F.length} findings.`;
  document.getElementById("tbody").innerHTML=rows.map(f=>{
    const rv=RVS[f.key],open=state.open.has(f.key);
    return `<tr class="frow" id="row-${f.key}" tabindex="0" role="button" aria-expanded="${open}"
      aria-label="${esc(f.reviewer+" "+f.finding_id+": "+f.title)}. Activate for details." data-key="${f.key}">
      <td>${chip(f.reviewer)}</td>
      <td><span class="mono" style="color:var(--mut)">${f.finding_id}</span> ${esc(f.title)}</td>
      <td>${stamp(f.severity_round1)}</td><td>${stamp(f.severity_final)}</td>
      <td>${f.changed?`<span class="up" style="color:${f.severity_final==="BLOCKING"?"var(--blk)":"var(--maj)"}">↑ UPGRADED</span>`:'<span class="up" style="color:var(--mut)">—</span>'}</td></tr>`+
      (open?`<tr class="det"><td colspan="5">${esc(f.description)}
        <div class="ref">SOURCE: ${esc(f.reference)}</div>
        ${f.changed&&rv?`<div class="why"><b>WHY IT MOVED</b><br>“${esc(rv.reason)}”</div>`:""}</td></tr>`:"");
  }).join("");
  document.querySelectorAll("#tbody tr.frow").forEach(tr=>{
    const t=()=>{const k=tr.dataset.key;state.open.has(k)?state.open.delete(k):state.open.add(k);renderTable();};
    tr.addEventListener("click",t);
    tr.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();t();}});
  });
}
document.querySelectorAll("[data-rev]").forEach(b=>b.onclick=()=>{state.rev=b.dataset.rev;
  document.querySelectorAll("[data-rev]").forEach(x=>x.setAttribute("aria-pressed",x===b));renderTable();});
document.querySelectorAll("[data-sev]").forEach(b=>b.onclick=()=>{state.sev=b.dataset.sev;
  document.querySelectorAll("[data-sev]").forEach(x=>x.setAttribute("aria-pressed",x===b));renderTable();});
document.getElementById("ckR1").onchange=e=>{state.useR1=e.target.checked;renderTable();};
document.getElementById("ckCh").onchange=e=>{state.changedOnly=e.target.checked;renderTable();};
document.querySelectorAll("th [data-sort]").forEach(b=>b.onclick=()=>{
  if(state.sortCol===b.dataset.sort)state.sortDir*=-1;else{state.sortCol=b.dataset.sort;state.sortDir=1;}
  renderTable();});
renderTable();
function setPressed(sel,attr,val){document.querySelectorAll(sel).forEach(x=>x.setAttribute("aria-pressed",x.dataset[attr]===val));}
function gotoTable(rev,sev,useR1){
  state.rev=rev;state.sev=sev;state.useR1=useR1;state.changedOnly=false;
  document.getElementById("ckR1").checked=useR1;document.getElementById("ckCh").checked=false;
  setPressed("[data-rev]","rev",rev);setPressed("[data-sev]","sev",sev);
  renderTable();v6.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
function gotoFinding(key){
  state.rev="ALL";state.sev="ALL";state.changedOnly=false;
  document.getElementById("ckCh").checked=false;
  setPressed("[data-rev]","rev","ALL");setPressed("[data-sev]","sev","ALL");
  state.open.add(key);renderTable();
  const row=document.getElementById("row-"+key);
  if(row){row.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});
    row.classList.add("flash");setTimeout(()=>row.classList.remove("flash"),2000);row.focus({preventScroll:true});}}
window.gotoFinding=gotoFinding;

/* ---------- footer ---------- */
document.getElementById("foot").innerHTML=`
<h3>Quick wins (from the synthesis)</h3>
<ol>${DATA.synthesis.quick_wins.map(q=>`<li><b>${esc(q.title)}.</b> <span class="qd">${esc(q.detail)}</span></li>`).join("")}</ol>
<p style="margin-top:28px">Six isolated agent contexts · parallel review · cross-examination · moderated synthesis<br>
Document reviewed: <span class="mono">${esc(DATA.meta.document_reviewed)}</span> · ${DATA.meta.review_date} · ${F.length} findings from ${REV.length} reviewers</p>`;

/* deep links */
if(location.hash){const el=document.querySelector(location.hash.replace(/[^#\w-]/g,""));
  if(el&&el.classList.contains("card")){const h=el.querySelector(".cardhead");
    h.setAttribute("aria-expanded","true");el.querySelector(".cardbody").hidden=false;
    el.scrollIntoView();}}
</script>
</body>
</html>
